[package]
name = "fina-server"
description = "HTTP/REST adapter over fina-kernel (web transport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fina-server"
path = "src/main.rs"

[dependencies]
fina-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
actix-web = "4.9"
actix-cors = "0.7"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"

[dev-dependencies]
actix-rt = "2"
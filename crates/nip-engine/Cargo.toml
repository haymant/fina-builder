[package]
name = "nip-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Narrative Intelligence service foundation for fina-builder"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
nip-domain = { path = "../nip-domain" }
nip-store = { path = "../nip-store" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
ureq = { version = "3.4.2", features = ["json"] }
url = "2"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }

[[bin]]
name = "nip-engine"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

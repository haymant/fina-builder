[package]
name = "nip-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Narrative Intelligence service foundation for fina-builder"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
nip-domain = { path = "../nip-domain" }
nip-store = { path = "../nip-store" }
quick-xml = "0.42"
serde_json = "1"
thiserror = "2"
ureq = "3.4.2"
url = "2"

[[bin]]
name = "nip-engine"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[package]
name = "payoff-explorer"
version = "0.1.0"
description = "Fina Builder desktop shell with Tauri IPC and embedded local llama.cpp assistant"
authors = ["fina"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fina_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# The desktop shell is a THIN ADAPTER. All domain logic lives in fina-kernel;
# see FEATURES.md section 4. Commands in src/commands/ must be
# pure pass-throughs: no formulas, no domain defaults, no branching on values.
fina-kernel = { workspace = true }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["common", "openmp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
encoding_rs = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[package]
name = "payoff-explorer"
version = "0.1.0"
description = "Fina Builder desktop shell with Tauri IPC and embedded local llama.cpp assistant"
authors = ["fina"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fina_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

# Backend selection is explicit so the default build remains portable. CUDA
# requires an NVIDIA driver/toolkit on the build machine and is not enabled by
# merely running the app on a CUDA-capable computer.
[features]
default = []
cuda = ["riga-server/cuda"]
metal = ["riga-server/metal"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# RIGA agent host (the chat panel). These are vendored at `modules/riga`; the
# `cuda` feature forwards to `riga-server` so `npm run tauri:dev:cuda` runs the
# agent's local GGUF inference on the GPU.
riga-kernel = { path = "../modules/riga/crates/riga-kernel" }
riga-server = { path = "../modules/riga/crates/riga-server" }
riga-shell = { path = "../modules/riga/crates/riga-shell" }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }

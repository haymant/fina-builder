[package]
name = "payoff-explorer"
version = "0.1.0"
description = "Fina Builder desktop shell — Tauri IPC adapter over fina-kernel"
authors = ["fina"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fina_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# The desktop shell is a THIN ADAPTER. All domain logic lives in fina-kernel;
# see PHASE1_MIGRATION_PROMPT.md section 4. Commands in src/commands/ must be
# pure pass-throughs: no formulas, no domain defaults, no branching on values.
fina-kernel = { workspace = true }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"

[workspace]
resolver = "2"
members = [
    "src-tauri",
]
# The vendored engine submodules are standalone workspaces (§3.10): keep them
# out of fina-builder's workspace so each resolves its own `Cargo.lock` and can
# be built with `cargo build --manifest-path modules/<dir>/Cargo.toml`.
exclude = ["modules/riga-flow", "modules/tac-engine", "modules/riga"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"

[workspace]
resolver = "2"
members = [
    "crates/fina-kernel",
    "crates/fina-server",
    "crates/fina-cli",
    "crates/fina-mcp",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# fina-kernel dependency allowlist is intentionally minimal. Every entry here
# that fina-kernel does not use must be removed from ITS OWN Cargo.toml;
# the workspace table may grow for adapters. CI job `dependency-hygiene`
# asserts fina-kernel's direct deps against this list.
fina-kernel = { path = "crates/fina-kernel" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"

# Size-optimized profile for embedded/headless runner binaries.
# Used with `cargo build --profile release-runner -p fina-cli -p fina-server`.
[profile.release-runner]
inherits = "release"
opt-level = "z"
lto = true
strip = true
panic = "abort"
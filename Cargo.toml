[workspace]
resolver = "2"
members = [
    "crates/fina-kernel",
    "src-tauri",
]
# The vendored engine submodules are standalone workspaces (§3.10): keep them
# out of fina-builder's workspace so each resolves its own `Cargo.lock` and can
# be built with `cargo build --manifest-path modules/<dir>/Cargo.toml`.
exclude = ["modules/riga-flow", "modules/tac-engine", "modules/riga"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

# fina-kernel dependency allowlist is intentionally minimal. Every entry here
# that fina-kernel does not use must be removed from ITS OWN Cargo.toml;
# the workspace table may grow for adapters. CI job `dependency-hygiene`
# asserts fina-kernel's direct deps against this list.
fina-kernel = { path = "crates/fina-kernel" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
# -----------------------------------------------------------------------------
# CONTROL for workflow_lgb_sp5d_rankic_short.yaml: identical in every way
# except backtest.exchange_kwargs, which uses qlib's BASE Exchange (flat
# kwargs form) with the SAME impact_cost=0.001.
#
# Purpose: isolate the effect of swapping in TradeACExchange. TopkDropout is
# long-only here, so this control and the TradeAC run should produce nearly
# identical portfolio metrics; any material gap means the custom exchange is
# distorting normal (non-short) trading.
#
# Run:
#   rd_run_workflow config_path=tac-qlib/workflows/workflow_lgb_sp5d_rankic_short_control.yaml \
#       experiment_name=tac-rd-evolve
# -----------------------------------------------------------------------------
{%- set LAKE = TAC_LAKE_DIR %}
{%- set UNIVERSE = "AAPL,MSFT,TSLA,QQQ,IVV,SMH,TLT,IBIT,MCHI,AIQ" %}
{%- set SP_FIELDS = "sp_ret,sp_logp,sp_rv1,sp_rv5,sp_rv22,sp_vol_ratio_5_22,sp_vol_ratio_1_22,sp_trend_slope_5,sp_trend_slope_20,sp_trend_slope_60,sp_dsv_1,sp_dsv_5,sp_dsv_22,sp_dsv_ratio_1,sp_dsv_ratio_5,sp_dsv_ratio_22,sp_rskew_5,sp_rskew_22,sp_rkurt_5,sp_rkurt_22,sp_rv_ac1,sp_rv_cv_22" %}

qlib_init:
    provider_uri: "{{ LAKE }}"
    region: us
    expression_cache: null
    dataset_cache: null

    calendar_provider:
        class: tac_qlib.data.providers.LakeCalendarProvider
        kwargs:
            lake_root: "{{ LAKE }}"
            market: US
    instrument_provider:
        class: tac_qlib.data.providers.LakeInstrumentProvider
        kwargs:
            lake_root: "{{ LAKE }}"
            market: US
            markets: {}
    feature_provider:
        class: tac_qlib.data.providers.LakeFeatureProvider
        kwargs:
            lake_root: "{{ LAKE }}"
            market: US

    exp_manager:
        class: MLflowExpManager
        module_path: qlib.workflow.expm
        kwargs:
            uri: "postgresql+psycopg://postgres:XMhaRhbi1CD8nAM2ZRBCGYfphw9frWtvyim7vSIE2wE9dABtR0fXr1LuAfdwaiGu@192.168.1.96:5555/tradeac_local"
            default_exp_name: "tac-rd-evolve"

task:
    model:
        class: RankICLGBModel
        module_path: tac_qlib.contrib.model.rank_gbdt
        kwargs:
            loss: mse
            learning_rate: 0.02
            num_leaves: 31
            num_boost_round: 3000
            early_stopping_rounds: 200
            min_data_in_leaf: 20
            lambda_l2: 0.5
            colsample_bytree: 0.8
            subsample: 0.8
            subsample_freq: 1
            reg_alpha: 0.1
            reg_lambda: 1.0
            seed: 42

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: TACHandler
                module_path: tac_qlib.contrib.data.handler
                kwargs:
                    instruments: "{{ UNIVERSE }}"
                    start_time: "2000-01-03"
                    end_time: "2026-08-14"
                    fit_start_time: "2022-08-15"
                    fit_end_time: "2026-08-14"
                    freq: day
                    lake_root: "{{ LAKE }}"
                    market: US
                    label: "Ref($close,-6)/Ref($close,-1)-1"
                    feature_fields: "$open,$high,$low,$close,$vwap,$volume,{{ SP_FIELDS }}"
                    infer_processors:
                        - class: DropAllNaN
                          kwargs:
                              fit_start_time: "2022-08-15"
                              fit_end_time: "2026-08-14"
                        - class: ProcessInf
                          kwargs: {}
                        - class: CSRankNorm
                          kwargs: {}
                        - class: ZScoreNorm
                          kwargs:
                              fit_start_time: "2022-08-15"
                              fit_end_time: "2026-08-14"
                        - class: Fillna
                          kwargs: {}
            segments:
                train:
                    - 2022-08-15
                    - 2025-12-31
                valid:
                    - 2026-01-02
                    - 2026-04-30
                test:
                    - 2026-05-01
                    - 2026-08-14

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: {}
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: True
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config:
                  strategy:
                      class: TopkDropoutStrategy
                      module_path: qlib.contrib.strategy
                      kwargs:
                          signal: "<PRED>"
                          topk: 4
                          n_drop: 1
                          only_tradable: true
                          risk_degree: 0.95
                  backtest:
                      start_time: 2026-05-01
                      end_time: 2026-08-14
                      account: 1000000
                      benchmark: QQQ
                      exchange_kwargs:
                          deal_price: $close
                          open_cost: 0.0005
                          close_cost: 0.0015
                          min_cost: 5.0
                          impact_cost: 0.001
              risk_analysis_freq: 1d

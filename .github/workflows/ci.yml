# Fina Builder CI (FEATURES.md §6.3).
# Jobs run cheapest-first; each has a timeout.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: "Guard: test mocks must not reach the production bundle"
        run: |
          if grep -r "unmocked tauri command" dist/; then
            echo "::error::test mock bundled into production build; check the resolve.alias guard in vite.config.ts"
            exit 1
          fi
      - run: npm run test:run

  adapters:
    name: Desktop shell (fmt, clippy, tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml is the single source of truth; the workflows pin the
      # same version so the toolchain is installed explicitly. This step fails if
      # the two ever drift, which is the failure mode that breaks CI.
      - name: Verify the pinned toolchain matches rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          have=$(rustc --version | sed -n 's/^rustc \([0-9.]*\).*/\1/p')
          if [ "$want" != "$have" ]; then
            echo "::error::rust-toolchain.toml pins $want but this job runs $have — update the dtolnay/rust-toolchain@ pins in .github/workflows/"
            exit 1
          fi
          echo "toolchain $have matches rust-toolchain.toml"
      # Scoped to the workspace member: `cargo fmt --all` also formats *path*
      # dependencies, which would reformat the vendored `modules/riga` sources.
      - run: cargo fmt -p payoff-explorer --check
      # `payoff-explorer`'s build script (tauri-build) validates every
      # `bundle.externalBin` resource at compile time and fails the build if one
      # is missing: "resource path `binaries/riga-mcp-<triple>` doesn't exist".
      # `src-tauri/binaries/` is gitignored and normally staged by
      # `beforeBuildCommand`, which only runs for `tauri build`/`tauri dev` — so
      # plain `cargo clippy`/`cargo test` stages placeholders explicitly. The
      # real engine sidecars are built by `tauri build` (release workflow).
      - name: Stage sidecar placeholders
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          : > "src-tauri/binaries/riga-mcp-$triple"
          : > "src-tauri/binaries/tac-engine-$triple"
      # The Tauri crate needs the GTK/GLib/WebKit system libraries to even build;
      # the script is the single source of truth for that list and is a no-op
      # elsewhere. See scripts/ci/install-tauri-linux-deps.sh.
      - name: Install Tauri Linux prerequisites
        run: ./scripts/ci/install-tauri-linux-deps.sh
      - run: cargo clippy -p payoff-explorer --all-targets -- -D warnings
      - run: cargo test -p payoff-explorer

  coverage:
    name: UI and Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: UI coverage (Vitest and Playwright)
        id: ui_coverage
        run: npm run test:coverage:ui
        continue-on-error: true
      - name: Install cargo-llvm-cov and LLVM tools for all module toolchains
        run: |
          rustup component add llvm-tools-preview --toolchain 1.99.0
          rustup toolchain install stable --profile minimal
          rustup component add llvm-tools-preview --toolchain stable
          cargo install cargo-llvm-cov --locked
      # `cargo llvm-cov --workspace` compiles every member, including the Tauri
      # shell, so this job needs the same system libraries as the adapters job.
      - name: Install Tauri Linux prerequisites
        run: ./scripts/ci/install-tauri-linux-deps.sh
      # Same reason as the `adapters` job: tauri-build refuses to compile
      # `payoff-explorer` while a declared `bundle.externalBin` resource is
      # missing, and `cargo llvm-cov` compiles that crate.
      - name: Stage sidecar placeholders
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          : > "src-tauri/binaries/riga-mcp-$triple"
          : > "src-tauri/binaries/tac-engine-$triple"
      - name: Rust coverage (app and dependency modules)
        id: rust_coverage
        run: npm run test:coverage:rust
        continue-on-error: true
      - name: Enforce Rust coverage gate
        id: rust_gate
        if: always()
        run: python3 scripts/gate-coverage.py coverage/rust/lcov.info
        continue-on-error: true
      - name: Combine LCOV reports and write coverage summary
        id: coverage_summary
        if: always()
        run: node scripts/coverage-summary.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - name: Fail if tests or coverage gates failed
        if: always()
        env:
          UI_OUTCOME: ${{ steps.ui_coverage.outcome }}
          RUST_OUTCOME: ${{ steps.rust_coverage.outcome }}
          GATE_OUTCOME: ${{ steps.rust_gate.outcome }}
          SUMMARY_OUTCOME: ${{ steps.coverage_summary.outcome }}
        run: |
          failed=0
          for outcome in "$UI_OUTCOME" "$RUST_OUTCOME" "$GATE_OUTCOME" "$SUMMARY_OUTCOME"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Coverage tests, report generation, or a coverage gate failed. See the preceding steps and uploaded reports."
            exit 1
          fi

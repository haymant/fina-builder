# Fina Builder CI (FEATURES.md §6.3).
# Jobs run cheapest-first; each has a timeout.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: "Guard: test mocks must not reach the production bundle"
        run: |
          if grep -r "unmocked tauri command" dist/; then
            echo "::error::test mock bundled into production build; check the resolve.alias guard in vite.config.ts"
            exit 1
          fi
      - run: npm run test:run

  core:
    name: Rust core (fmt, clippy, kernel tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p fina-kernel

  adapters:
    name: Adapters (cli, server, tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fina-cli -p fina-server
      # Tauri requires system webkit libs to link; a no-feature build is the
      # compile check that does not. Package list is the Tauri v2 prerequisite set
      # for Debian/Ubuntu (libayatana-appindicator3-dev, not libappindicator3-dev,
      # which Ubuntu 24.04 no longer ships).
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file
      - run: cargo check -p payoff-explorer --lib

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Rust coverage
        run: |
          cargo llvm-cov --workspace --exclude fina-mcp --lcov --output-path lcov.info
      - name: Enforce coverage gates
        run: python3 scripts/gate-coverage.py lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/
          if-no-files-found: ignore

  dependency-hygiene:
    name: Kernel dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p fina-kernel --test dependency_hygiene
# Release pipeline: tag a version, get Linux/Windows/macOS binaries and a GitHub Release.
#
#   git tag -a v0.1.1 -m "0.1.1" && git push origin v0.1.1
#
# Jobs, in order:
#   1. release-create  — validates the tag, stamps the version into the manifests and
#                       opens a DRAFT release, so a half-built release is never visible
#                       as "latest".
#   2. desktop         — Tauri bundles per platform: Linux (AppImage/deb/rpm),
#                       macOS (dmg, Intel + Apple Silicon), Windows (msi + setup.exe).
#   3. release-publish — flips the draft to published. It needs 2 to be green,
#                       so a failed platform build can never ship a partial release.
#
# Signing: no secrets are required. If the APPLE_* / WINDOWS_* secrets below exist they
# are picked up automatically by the Tauri CLI and the bundles are signed (and
# notarised); otherwise the artifacts are unsigned and Gatekeeper/SmartScreen warn.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release-create:
    name: Validate tag and open draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Validate the tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $TAG -> version $version, prerelease=$prerelease"
      - name: Open the draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets are re-uploaded to it."
            gh release edit "$TAG" --draft --prerelease="$PRERELEASE" --title "$TAG"
          else
            gh release create "$TAG" --draft --title "$TAG" \
              --prerelease="$PRERELEASE" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.validate.outputs.prerelease }}

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: release-create
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.release-create.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--bundles` is set explicitly per platform rather than taking
          # `bundle.targets: "all"` from tauri.conf.json: "all" on macOS also
          # produces the bare `.app` directory, which cannot be uploaded as a
          # release asset (and the .dmg already contains it).
          #   linux  -> .deb, .rpm, AppImage
          #   macos  -> .dmg (universal app inside)
          #   windows-> .msi and setup.exe (NSIS)
          - label: linux-x86_64
            os: ubuntu-24.04
            args: '--bundles deb,rpm,appimage'
            targets: ''
          # macos-15/macos-14/macos-latest are Apple Silicon runners; the Intel
          # image is `macos-15-intel` (macos-13 was retired by GitHub).
          #
          # `minimumSystemVersion` in tauri.conf.json (11.0) makes the Tauri CLI
          # export `MACOSX_DEPLOYMENT_TARGET`. llama.cpp's ggml needs >= 10.15
          # for std::filesystem; 11.0 also matches the Rust aarch64 target
          # default so ggml and the final link agree (a lower ggml target links
          # without `___isPlatformVersionAtLeast`). `deploymentTarget` below only
          # keys the rust-cache so a stale CMake tree is never reused.
          - label: macos-aarch64
            os: macos-15
            args: '--target aarch64-apple-darwin --bundles dmg'
            targets: 'aarch64-apple-darwin'
            deploymentTarget: '11.0'
          - label: macos-x86_64
            os: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles dmg'
            targets: 'x86_64-apple-darwin'
            deploymentTarget: '11.0'
          - label: windows-x86_64
            os: windows-2025
            args: '--bundles msi,nsis'
            targets: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          # Include the macOS deployment target in the key: llama-cpp-sys
          # configures CMake with `always_configure(false)` and reuses the
          # cached build tree, so a cache restored from a different
          # deployment target would keep the stale `-mmacosx-version-min`.
          key: desktop-${{ matrix.label }}-${{ matrix.deploymentTarget || 'default' }}
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: ./scripts/ci/install-tauri-linux-deps.sh
      - name: Clear any stale llama.cpp CMake build tree
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # llama-cpp-sys configures CMake with `always_configure(false)` and
          # reuses its build tree. A tree restored by rust-cache from an earlier
          # deployment target keeps the stale `-mmacosx-version-min`, so drop the
          # cached llama.cpp build/install output before configuring.
          find target -type d -name 'llama-cpp-sys-2-*' -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Stamp the release version into the manifests
        run: node scripts/set-version.mjs ${{ needs.release-create.outputs.version }}
      - name: Forward the signing secrets only when they are actually set
        shell: bash
        # An *unset* secret expands to an empty string, and tauri-action reads an
        # empty APPLE_CERTIFICATE/WINDOWS_CERTIFICATE as "sign with this
        # certificate" — it then dies in `security import` with
        # `SecKeychainItemImport: One or more parameters ... not valid`.
        # Forwarding only non-empty values keeps unsigned builds unsigned.
        run: |
          set -euo pipefail
          forwarded=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "$name=${!name}" >> "$GITHUB_ENV"
              echo "signing secret present: $name"
              forwarded=1
            fi
          done
          if [ "$forwarded" = 0 ]; then
            echo "No signing secrets configured; building unsigned bundles."
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build bundles and attach them to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseDraft: true
          prerelease: ${{ needs.release-create.outputs.prerelease == 'true' }}
          # Machine-readable asset names: <name>_<version>_<platform>_<arch>.<ext>
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch].[ext]'
          args: ${{ matrix.args }}
          # Also keep the bundles as workflow artifacts, so a failed upload to
          # the release does not mean the builds are lost.
          uploadWorkflowArtifacts: true

  release-publish:
    name: Publish release
    needs: [release-create, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `gh release` resolves the repository from the git remote, so it fails
      # with "not a git repository" without a checkout. --repo is passed as well
      # so the job cannot depend on the checkout's remote name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Publish the draft
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
          PRERELEASE: ${{ needs.release-create.outputs.prerelease }}
          # A prerelease must not become the default download.
          LATEST: ${{ needs.release-create.outputs.prerelease == 'true' && 'false' || 'true' }}
